<div class="card p-3" style="min-width: 520px;">
  <div class="card-body">
    <h3 class="card-title">Sign In</h3>
    <p class="card-text">
      If you are already registered, please enter your credentials
    </p>
    

    <form>
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="Email address">
        <label for="email">Email address</label>
      </div>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="Password">
        <label for="password">Password</label>
      </div>
      <div class="d-flex justify-content-end">
        <button type="reset" class="w-25 rounded-pill btn btn-secondary me-2">Sign Up</button>
        <button type="submit" class="w-25 rounded-pill btn btn-warning">Sign In</button>
      </div>
    </form>
  </div>
</div>
