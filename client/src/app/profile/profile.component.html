<div class="card p-3" style="min-width: 520px;">
  <div class="card-body">
    <h3 class="card-title mb-2">My profile</h3>

    <p class="card-text mb-0">
      <strong>Username: </strong> {{ payload?.username }}
    </p>
    <p class="card-text mb">
      <strong>Email: </strong> {{ payload?.email }}
    </p>

    <button class="btn btn-warning" (click)="onLogout()">Logout</button>
  </div>
</div>
