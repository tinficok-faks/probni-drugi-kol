<div class="card p-3" style="min-width: 520px;">
  <div class="card-body">
    <h3 class="card-title">Sign Up</h3>
    <p class="card-text">
      Please enter your personal data
    </p>

    <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="username" placeholder="Username" name="username"
          [(ngModel)]="form.username" required>
        <label for="username">Username</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="Email address" name="email"
          [(ngModel)]="form.email" required>
        <label for="email">Email address</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="Password" name="password"
          [(ngModel)]="form.password" required>
        <label for="password">Password</label>
      </div>

      <div class="d-flex justify-content-end">
        <button type="button" (click)="goToSignIn()" class="w-25 rounded-pill btn btn-secondary me-2">
          Sign In
        </button>
        <button type="submit" class="w-25 rounded-pill btn btn-warning">
          Sign Up
        </button>
      </div>
    </form>
  </div>
</div>
